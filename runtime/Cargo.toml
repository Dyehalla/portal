[package]
name = "portal-runtime"
version = "0.1.0"
edition = "2024"
description = "QUIC service runtime with a local HTTP management API"

[[bin]]
name = "portal-runtime"
path = "src/main.rs"

[dependencies]
portal-net = { path = "../net" }
portal-files = { path = "../files" }
axum = "0.7"
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
