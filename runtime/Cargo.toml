[package]
name = "portal-runtime"
version = "0.1.0"
edition = "2024"
description = "Linux WireGuard runtime with a local HTTP management API"
rust-version = "1.89"

[[bin]]
name = "portal-runtime"
path = "src/main.rs"

[dependencies]
portal = { path = "../wireguard" }
portal-net = { path = "../net", features = ["agent"] }
axum = "0.7"
boringtun = { version = "=0.7.1", default-features = false }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8"

[dev-dependencies]
portal-coordinator = { path = "../coordinator" }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tempfile = "3"
rcgen = "0.13"
