[package]
name = "portal-runtime"
version = "0.1.0"
edition = "2024"
description = "Linux WireGuard runtime with a local HTTP management API"

[[bin]]
name = "portal-runtime"
path = "src/main.rs"

[dependencies]
portal = { path = "../wireguard" }
axum = "0.7"
boringtun = { version = "=0.7.1", default-features = false }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
zeroize = "1.8"
