[package]
name = "portal-runtime"
version = "0.1.0"
edition = "2024"
description = "Linux WireGuard runtime with a local HTTP management API"

[[bin]]
name = "portal-runtime"
path = "src/main.rs"

[dependencies]
portal = { path = "../wireguard" }
portal-files = { path = "../files", default-features = false }
axum = "0.7"
boringtun = { version = "=0.7.1", default-features = false }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["transport", "router"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
zeroize = "1.8"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
