[package]
name = "portal-runtime"
version = "0.1.0"
edition = "2024"
description = "Linux WireGuard runtime with a local HTTP management API"
rust-version = "1.89"

[dependencies]
portal = { path = "../wireguard" }
portal-net = { path = "../net", features = ["agent"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
boringtun = { version = "=0.7.1", default-features = false }
libc = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
zeroize = "1.8"

[dev-dependencies]
portal-coordinator = { path = "../coordinator" }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
tempfile = "3"
rcgen = "0.13"
