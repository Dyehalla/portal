[package]
name = "boringtun"
version = "0.7.1"
edition = "2018"
description = "BoringTun WireGuard tunnel core"
license = "BSD-3-Clause"
repository = "https://github.com/cloudflare/boringtun"

[features]
default = []
mock-instant = ["dep:mock_instant"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
aead = "0.5.0-pre.2"
blake2 = "0.10"
chacha20poly1305 = "0.10.0-pre.1"
hmac = "0.12"
mock_instant = { version = "0.3", optional = true }
parking_lot = "0.12"
portable-atomic = { version = "1.13.1", features = ["fallback"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
ring = "0.17"
tracing = "0.1.40"
x25519-dalek = { version = "2.0.1", features = ["reusable_secrets", "static_secrets"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["time"] }

[dev-dependencies]
etherparse = "0.13"
