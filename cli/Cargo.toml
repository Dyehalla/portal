[package]
name = "portal-cli"
version = "0.1.0"
edition = "2024"
description = "Linux command-line manager for portal WireGuard devices"

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
portal = { path = "../wireguard" }
boringtun = { version = "=0.7.1", default-features = false }
libc = "0.2"
zeroize = "1.8"
