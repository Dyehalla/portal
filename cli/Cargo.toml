[package]
name = "portal-cli"
version = "0.1.0"
edition = "2024"
description = "CLI client for the portal runtime HTTP management API"

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
rand = "0.8"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
