[package]
name = "portal-cli"
version = "0.1.0"
edition = "2024"
description = "Portal network agent, web panel and management CLI"

[[bin]]
name = "portal"
path = "src/main.rs"

[dependencies]
portal-runtime = { path = "../runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.8"

[dev-dependencies]
tempfile = "3"
