[package]
name = "portal-files"
version = "0.1.0"
edition = "2024"
description = "Peer-to-peer file transfers over authenticated QUIC"

[dependencies]
cap-std = "4"
portal-net = { path = "../net" }
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
