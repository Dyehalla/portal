syntax = "proto3";

package portal.files.v1;

service FileTransfer {
  // Authorize a peer and issue a short-lived, single-use HTTP download ticket.
  rpc ListShares(ListSharesRequest) returns (ListSharesResponse);
  rpc PrepareSmbConnection(PrepareSmbConnectionRequest) returns (PrepareSmbConnectionResponse);

  rpc PrepareDownload(PrepareDownloadRequest) returns (PrepareDownloadResponse);
}

message PrepareDownloadRequest {
  // A path relative to the file service's configured root directory.
  string path = 1;
}

message PrepareDownloadResponse {
  // The HTTP URL for the one-use ticket, reachable through the WireGuard network.
  string download_url = 1;
  string file_name = 2;
  uint64 size_bytes = 3;
  uint64 expires_at_unix_seconds = 4;
}

message ListSharesRequest {}
message SmbShare {
  string name = 1;
  string host = 2;
  uint32 port = 3;
  bool read_only = 4;
}
message ListSharesResponse { repeated SmbShare shares = 1; }
message PrepareSmbConnectionRequest { string share_name = 1; }
message PrepareSmbConnectionResponse {
  SmbShare share = 1;
  string username = 2;
  // Sensitive: deliver only over the WireGuard tunnel. Never log this field.
  // Shared server account; valid until password reconfiguration (not a short-lived ticket).
  string password = 3;
}
