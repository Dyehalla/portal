[package]
name = "portal-net"
version = "0.1.0"
edition = "2024"
description = "Authenticated QUIC transport for Portal services"

[dependencies]
iroh = { version = "=1.4.0", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "=1.4.0", default-features = false, features = ["key"] }
bytes = "1"
n0-watcher = "1"
noq-udp = "1.4"
tokio = { version = "1", features = ["macros", "io-util", "net", "sync", "rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
