[package]
name = "portal-net"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Portal network models, HTTPS client and policy compilation"

[features]
default = []
agent = ["dep:portal", "dep:x25519-dalek", "dep:reqwest", "dep:rustls"]

[dependencies]
portal = { path = "../wireguard", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", optional = true }
zeroize = "1.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
